<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#cd853f"/>
  <text x="150" y="75" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" dominant-baseline="middle">Seredo Sorghum</text>
  <text x="150" y="95" font-family="Arial, sans-serif" font-size="12" fill="#f5deb3" text-anchor="middle" dominant-baseline="middle">Brown Grain</text>
  <text x="150" y="110" font-family="Arial, sans-serif" font-size="12" fill="#f5deb3" text-anchor="middle" dominant-baseline="middle">12 bags/acre</text>
  <text x="150" y="125" font-family="Arial, sans-serif" font-size="12" fill="#f5deb3" text-anchor="middle" dominant-baseline="middle">3-4 months</text>
  <text x="150" y="140" font-family="Arial, sans-serif" font-size="10" fill="#f5deb3" text-anchor="middle" dominant-baseline="middle">Widely adaptable</text>
</svg>
